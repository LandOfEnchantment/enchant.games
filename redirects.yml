# Addresses that once served a page or article that has since been retired, and where each
# sends a visitor now. scripts/build.js writes a small page at each that forwards at once (a
# meta refresh with a canonical link, which search engines read as a permanent move), and
# check-dist holds every target to a page the build serves. The old ?slug= forms of these
# reach them through Cloudflare's 301s (terraform/rulesets.tf) first.
# scripts/browse-old-links.py opens every address the site ever had, these included.


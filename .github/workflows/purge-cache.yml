# A button that empties Cloudflare's cache of enchant.games without a deploy (as in
# ../merecatholicity.com): for when something is served stale that shouldn't be, or a cache
# rule changed (terraform/rulesets.tf). Every deploy already purges the addresses
# it serves (deploy.yml, after GitHub Pages has published); this waits for a running deploy
# (their shared concurrency group), so it never empties the cache before a publish.
#
# It runs in the `github-pages` environment, master only, for its Cloudflare token. It fails
# loudly without the token: a button pressed and quietly skipped would look like a purge.

name: purge cache

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Purge everything
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge.js --everything

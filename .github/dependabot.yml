# Keeps the SHA-pinned actions current: the repository requires every `uses:` to name a
# commit, so a bump is a pull request that changes a hash and its version comment. And the
# npm packages (package.json): the build's (marked and js-yaml, which draw the pages;
# esbuild, which bundles the script) and the font (firacode), which is served. Dependabot's pull requests are not the
# owner's: each waits for the owner's approval (owner-merge.yml approves only the owner's),
# and a merged bump redeploys the site. Pull requests carry no secrets.
# A release waits a week before Dependabot offers it, so a compromised one that is pulled
# quickly never reaches a deploy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      toolchain:
        update-types: ["minor", "patch"]

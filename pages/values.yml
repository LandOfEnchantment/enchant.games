  ---

  ## Values

  ### Homegrown
  Built here.
  Made with ❤️.

  ### Craft
  We care about every part of the work:
  `code`, `pixels`, `music`, and `stories`.

  ### Libre
  Built on free and open-source software.

  ### What We Don’t Do
  - **NO pay-to-win**
  - **NO microtransactions**
  - **NO advertisements**
  - **NO spyware or invasive anti-cheat**

  ### Ownership
  Not for rent.
  You buy it **once** → You own it **forever**.

  ### Respect
  We respect the player’s:
  - **`Time`**
  - **`Freedom`**
  - **`Intelligence`**
  - **`Attention`**
  - **`Humanity`**

  We do **not** manipulate, addict, or extract.

  ### Principle
  **Integrity wins.**

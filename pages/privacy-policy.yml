  ## Privacy Policy

  *Last updated October 12, 2026.*

  This policy explains what information Land of Enchantment Games ("we", "us") collects
  through enchant.games, how we use it, and the choices you have.

  ### What we collect

  We collect only what you choose to give us:

  - **Mailing list.** If you sign up, your email address, when you signed up, and what you
    agreed to receive.
  - **Contact form.** Your name, email address and message.

  When you visit, our hosting and security providers may process technical information
  such as your IP address, browser and the pages you request, as any website host does, to
  serve the site and protect it from abuse. Our forms use a bot check (Cloudflare
  Turnstile), which looks at your browser to tell people from bots.

  We don't use advertising, analytics or tracking cookies. An unsent contact form message
  is kept only in your own browser, so a refresh doesn't lose it.

  ### How we use it

  - To send the mailing list news about our games, including release announcements and
    sales promotions, if you agreed to it.
  - To answer your messages.
  - To run, secure and improve the site, and to meet our legal obligations.

  ### Who we share it with

  We don't sell or rent your personal information. We share it only with the service
  providers who run the site and its forms for us (for example, hosting, email and
  security providers), each only as far as it needs to do that job, and when the law
  requires it.

  ### How long we keep it

  We keep your email address on the mailing list until you unsubscribe or ask us to remove
  it, and messages for as long as we need them to answer you and keep sensible records.

  ### Your choices

  You can unsubscribe from the mailing list at any time, using the link in any of our
  marketing emails or by contacting us. You can also ask to see, correct or delete the
  information we hold about you. Depending on where you live, you may have further rights
  under the law, and we'll honor them.

  ### Children

  The site isn't directed at children under 13, and we don't knowingly collect their
  personal information. If you believe a child has given us theirs, contact us and we'll
  delete it.

  ### Security

  Information travels over encrypted connections (HTTPS) and is stored with our providers
  in access-controlled accounts. No method of transmission or storage is perfectly secure,
  but we work to protect what you share.

  ### Changes

  We may update this policy. The date at the top says when it last changed; a significant
  change will be noted on the site.

  ### Contact

  Questions or requests: send us a message on the [Press](/press/) page.

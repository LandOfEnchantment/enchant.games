  ## Privacy Policy

  *Last updated October 12, 2026.*

  This policy covers Land of Enchantment Games ("we"): this website, our games and our other
  services, wherever you get them. A store or platform that sells or runs our games (such as
  Steam) has its own privacy policy for what it collects.

  **What we collect.** What you give us: your email address if you join our mailing list
  (with when you joined and what you agreed to), and your name, email address and message if
  you contact us. The providers that host and protect our services may process technical
  data such as your IP address. This website has no ads, analytics or tracking cookies.

  **How we use it.** To send our mailing list news about our games, including releases and
  sales, if you agreed to it; to answer you; and to run and protect our services.

  **Sharing.** We don't sell your personal information. We share it only with the providers
  that run our services for us, and when the law requires it.

  **Your choices.** You can leave the mailing list at any time with the unsubscribe form on
  our [Games](/games/) page. For anything else about your information,
  [contact us](/press/).

  **Changes.** We may update this policy; the date above says when it last changed.

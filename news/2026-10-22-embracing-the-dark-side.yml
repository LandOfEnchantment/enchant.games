      <h3 id="dark-side">The right fear</h3>

      So I'm changing. I'm embracing the dark side. That's how it looked from where I stood in March. Using the machine was the dark side, and the pragmatists were Darth Vader. Take the power that's on the table and put it to work. The free software hippies like Stallman lost.<sup id="fnr-stallman"><a href="#fn-stallman">41</a></sup>

      My living depends on it, but that's a reason I weigh, not an order I follow. The clock can go back, remember. Chesterton warned in *The Outline of Sanity* that "those who begin by saying that we cannot abolish the machine, that we must use the machine, are themselves refusing to use the mind."<sup id="fnr-outline"><a href="#fn-outline">42</a></sup> I'm choosing it, with my mind, knowing what it costs.

      PauseAI US asks people to sign [a petition](https://www.pauseai-us.org/petition/) for "a global AI Treaty to ban superintelligent AI systems until they can be made safe." In March I'd have signed it. Would I still? No. Men can stop it, but can isn't should. Prudence weighs what a pause would give up, and I'd take the cures. It also asks whether the means can work, and a treaty that can't be verified binds nobody.<sup id="fnr-st49"><a href="#fn-st49">43</a></sup> Pope Leo XIV asks for a politics "capable of slowing things down when everything is accelerating."<sup id="fnr-mh"><a href="#fn-mh">44</a></sup> I respect the bishop of Rome without holding his every judgment binding, and on this one I part ways with him.

      But I pay for an AI subscription, and the company behind it is racing the others to the next model. Doesn't that feed the wolf? The evil isn't building the thing. It's the racing, the creedless wolf Ulysses warned about. My fee can't pay for the building without paying for the race too. Money is fungible. But what I buy is a tool, and the racing is their choice, not mine. The moral theologians have a name for it, cooperation. Sharing in the evil, wanting what the other man wants, is formal cooperation, and it's never allowed. Helping without wanting it, from far off, is remote material cooperation, and it's allowed for a proportionate reason.<sup id="fnr-coop"><a href="#fn-coop">45</a></sup> I don't want the race, a monthly fee is a long way from it, and my livelihood is a proportionate reason. If using the tool ever meant wanting the race, I'd be out.

      There's one more condition, scandal, which means not leading anyone else into sin by your example. Writing this makes me an example, so here are the terms, and I don't always meet them. I use it the way Linus does. I keep the craft. I'd rather run a model on hardware I own than rent one, once the open models are both good and efficient enough.

      Chesterton would take the tool, then ask whose tool it is. His fight was over who owns the means of making things. "Too much capitalism does not mean too many capitalists, but too few capitalists."<sup id="fnr-divorce"><a href="#fn-divorce">46</a></sup> A monthly bill to a lab is too few capitalists, the owning for renting trade at its worst.

      He even had a case like ours. In his day it was electricity. A central plant was "a real dependence," he granted, but "if electricity could be cheapened, the chances of a very large number of small independent shops, especially workshops, would be greatly improved." So use it, he decided, "to break up the hopeless block of concentrated capital and management." The point was never the machine. "We are concerned to produce a particular sort of men, the sort of men who will not worship machines even if they use machines."<sup id="fnr-sanity"><a href="#fn-sanity">47</a></sup>

      The models are the electricity this time. Friends of mine already run open models on hardware they own. One of them runs four agents at once on a single graphics card. The models aren't the frontier yet, but they do real work. Make them cheaper still, and a town could own a datacenter the way it owns its library, a shop could own its model, and the common man gets his workshop back.

      America's founders protected a machine once already. The 1st Amendment guards "the freedom of speech, or of the press,"<sup id="fnr-first"><a href="#fn-first">48</a></sup> and the press was a machine. England licensed its presses until 1695, and the founders made sure Congress never could. Nobody needs a license to run one. A model on your own hardware is the press of our day, and nobody should need a license to run that either. The law can only keep the door open. If we walk through it and own the thing, the power stays with the people. Who's to say we don't get there?

      That's where Stallman ended up. He has a name for renting what you could run yourself, Service as a Software Substitute, and says it gives "someone else power over your computing."<sup id="fnr-saass"><a href="#fn-saass">49</a></sup> The free software hippies lost the war, and here I am at their conclusion, by Chesterton's road. Stallman would tell me to cancel my subscription. He'd have a point.

      > Fear is the path to the dark side... fear leads to anger... anger leads to hate... hate leads to suffering.
      >
      > Yoda, *Star Wars: Episode I*<sup id="fnr-yoda"><a href="#fn-yoda">50</a></sup>

      The joke's on me. I walked every step of the path Yoda warned about, resisting.

      First I feared using it. Then I feared being forced to use it. Then I feared falling behind if I didn't. Then I feared being replaced by it.

      Then the anger. I told you to tell your AI-pushing boss to get wrecked.

      Then the hate. I hated falling behind. I had disdain for anyone who'd trust a random guessing machine, a magic black box, a slop generator.

      Hate leads to suffering, and I've had my fill. The way off that path is virtue, which is "a mean, i.e. the mean relative to us."<sup id="fnr-eth2"><a href="#fn-eth2">51</a></sup> Between the zealot and the luddite stands the brave man, the one "who faces and who fears the right things and from the right motive, in the right way."<sup id="fnr-eth3"><a href="#fn-eth3">52</a></sup>

      Courage gets you through the fear. It doesn't make the call. That's prudence, which Aquinas calls the "right reason of things to be done."<sup id="fnr-st57"><a href="#fn-st57">53</a></sup> Choosing it with my mind means choosing it by prudence.

      The machine grows in degree, never in kind. It can't become a mind, but it can become powerful. Power without a mind needs a master, and a master needs a mind. If it isn't yours, it'll be the lab's, or nobody's at all.

      Fear of falling behind isn't the right fear. Fear of being mastered is.

      And being mastered won't look like a tyrant. It'll look like Amodei's caretaker, a coach that studies you and a system that decides what to reward in you. The machine of loving grace is the master with a smile.

      I called the machine the dark side. Fear was the dark side, and I was already there. What I'm embracing is a tool, used with a mind.


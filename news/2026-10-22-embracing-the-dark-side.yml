      <h3 id="dark-side">Embracing the dark side</h3>

      So I'm changing. I'm embracing the dark side.

      The dark side is the pragmatist's side. Take the power that's on the table,
      the machine, the robots, and the Empire if it comes to that, and put it to
      work. Darth Vader doesn't sit around mourning the Old Republic.

      Up close, it looks like Linus's patch. The machine does the work, and the man
      who understands it answers for it.

      I'm not doing it because I have to. The clock can go back, remember.
      Chesterton warned in *The Outline of Sanity* that "those who begin by saying
      that we cannot abolish the machine, that we must use the machine, are
      themselves refusing to use the mind."<sup id="fnr-outline"><a href="#fn-outline">70</a></sup> I'm choosing it,
      with my mind, knowing what it costs.

      > Fear is the path to the dark side… fear leads to anger… anger leads to hate…
      > hate leads to suffering.
      >
      > Yoda, *Star Wars: Episode I*<sup id="fnr-yoda"><a href="#fn-yoda">71</a></sup>

      The joke's on me. I walked every step of the path Yoda warned about,
      resisting.

      Fear of being replaced. Fear of falling behind. Then the anger. Then the hate.

      I hate falling behind.

      I hate the fear-based, anti-LLM thinking that would rather lose than automate
      anything.

      I hate FUD.

      And hate wants a target. When a whole trade gets flattened, a scared crowd
      turns on the hype men, the luddites, the CEO, or the machine itself.

      Girard spent his life on that move.<sup id="fnr-scapegoat"><a href="#fn-scapegoat">72</a></sup> The crowd blames
      its victim for the crisis, then worships him for the peace after. Myth tells
      it from the crowd's side, and the victim is guilty. The Gospel tells it from
      the victim's side, and he's innocent.

      Hating the machine as a devil is the same mistake as worshiping it, turned
      upside down. And I've made it.

      So I checked my own targets. I still mean every sharp word about that essay,
      and about software engineers. But hanging the whole mess on one target is the
      crowd's old trick.

      Hate leads to suffering, and I've had my fill. The way off that path is
      virtue, which is "a mean, i.e. the mean relative to us."<sup id="fnr-eth2"><a href="#fn-eth2">73</a></sup>
      Between the zealot and the luddite stands the brave man, the one "who faces
      and who fears the right things and from the right motive, in the right
      way."<sup id="fnr-eth3"><a href="#fn-eth3">74</a></sup>

      Fear of falling behind isn't the right fear. Fear of being mastered is.

      I came out the other side of the fear, and the dark side doesn't look so dark
      from here. We'll see wealth like the world has never seen, with a robot army
      at our service.


      <h3 id="linus">Even Linus</h3>

      I use it, as a tool. Even Linus Torvalds does. Tom's Hardware reported on a patch series he built with an LLM.<sup id="fnr-toms"><a href="#fn-toms">34</a></sup>

      It started as a branch to make reading files from the page cache, the copy of your files the kernel keeps in memory, scale. His write-up of the branch is plain about how it was made.<sup id="fnr-commit"><a href="#fn-commit">35</a></sup>

      > The code, the test programs, the review behind the list above and the first draft of this text were done with an LLM coding assistant (Claude Code) under my direction. The measurements were run on my machine.

      The write-up owns up to ten known problems. Another kernel developer, Kiryl Shutsemau, found the first version could get processes killed when a machine ran short of memory, and had a better idea, to hold back only the pages that get read again and again.

      Linus reworked it, with two patches from Kiryl, and posted it to the mailing list<sup id="fnr-lore"><a href="#fn-lore">36</a></sup> as rcu-free-v3.<sup id="fnr-rcu"><a href="#fn-rcu">37</a></sup> He called his own best benchmark, 23 times faster, "not a real number in the sense that no real load will ever see it."

      Kiryl found a race too, a read that could return bytes nobody ever wrote there.<sup id="fnr-race"><a href="#fn-race">38</a></sup> None of it has merged. That isn't the method failing. That's peer review doing its job.

      Most of us aren't Linus. That's what tests, review and staged rollouts are for. They hold what one head can't.<sup id="fnr-whiteboard"><a href="#fn-whiteboard">39</a></sup>

      That's what using it well looks like. The machine wrote the code. A man who knows the kernel as well as anyone alive directed it, measured it, put it in front of his peers, took their correction, and owns the result.

      A tool acts only as the hand moves it, so the work is the hand's.<sup id="fnr-st62"><a href="#fn-st62">40</a></sup> When Linus signs his patch, he owns it. Each one carries an "Assisted-by: LLM" line, right next to his "Signed-off-by." When a company ships slop, it can't blame the model.

      It's the interface I argued for back in March, precise code understood and audited by humans, with a much faster pair of hands.

      Girard would catch me here. Am I doing it because Linus does? That would be copying his wants. It was my own build that changed my mind. What I take from Linus is how he uses it.


      <h3 id="good-life">The good life</h3>

      A long time ago, Aristotle wondered what would happen if the tools ran
      themselves:

      > For if every instrument could accomplish its own work… if, in like manner,
      > the shuttle would weave and the plectrum touch the lyre without a hand to
      > guide them, chief workmen would not want servants, nor masters slaves.
      >
      > Aristotle, *Politics* I.4<sup id="fnr-pol14"><a href="#fn-pol14">75</a></sup>

      He meant it as the impossible case, the one condition under which nobody would
      need a slave. The shuttle weaves itself now.

      But I have to check myself here. Wealth is only ever useful for something
      else, and man's happiness can't consist in it.<sup id="fnr-st2a1"><a href="#fn-st2a1">76</a></sup> The robot
      army's wealth is worth exactly what we do with it.

      Nobody can hand you happiness, not even a machine. The human good is "activity
      of soul in accordance with virtue… For one swallow does not make a
      summer,"<sup id="fnr-eth1"><a href="#fn-eth1">77</a></sup> and a world that does everything for you takes away
      the very activities happiness is made of.

      A world freed from work isn't a good world unless people know what leisure is
      for. Aristotle said business takes courage and leisure takes
      philosophy.<sup id="fnr-pol7"><a href="#fn-pol7">78</a></sup> Josef Pieper went further in *Leisure: The Basis
      of Culture*: "When separated from worship, leisure becomes toilsome, and work
      becomes inhuman."<sup id="fnr-pieper"><a href="#fn-pieper">79</a></sup> Without worship, free time goes to
      scrolling the social media feed.

      Copying was never the trouble. The trouble is who we copy. Copy the machine,
      and you're copying a copy of the crowd. That's how you get an NPC.

      Girard's answer was the oldest one. Christ asks to be imitated, and he's
      nobody's rival. "In inviting us to imitate him, he invites us to imitate his
      own imitation."<sup id="fnr-satan"><a href="#fn-satan">80</a></sup> Copy that model, and nobody has to lose for
      you to win.

      That's why I said church and the trivium. The church gives you the right
      model, and the classics give you better ones than the influencers in your
      feed.

      And none of it comes unless humans rise up and take dominion over the
      machines. We were told to, in the beginning:

      > And God blessed them, and God said unto them, Be fruitful, and multiply, and
      > replenish the earth, and subdue it: and have dominion over the fish of the
      > sea, and over the fowl of the air, and over every living thing that moveth
      > upon the earth.
      >
      > Genesis 1:28<sup id="fnr-genesis"><a href="#fn-genesis">81</a></sup>

      That dominion comes from God and answers to him. Vader's pragmatism I can live
      with. Lucifer's pride, no.


title: Embracing the dark side
slug: 2026-10-22-embracing-the-dark-side
date: 2026-10-22
author: Adam Schaefers
body: |

      *Republished from my blog at [adamschaefers.com](https://adamschaefers.com/blog/2026-10-21-embracing-the-dark-side/), where it first appeared on October 21, 2026.*

      <img src="/images/ai-crusades.webp" alt="Embracing the dark side" width="1168" height="784" style="max-width:100%;height:auto;">

      *An Aristotelian analysis of large language models.*

      In March I made a video telling you to "tell your AI-pushing boss to get wrecked."<sup id="fnr-artisan"><a href="#fn-artisan">1</a></sup>

      When Aristotle broke with his own teacher, he called it a duty, "for the sake of maintaining the truth even to destroy what touches us closely."<sup id="fnr-truth"><a href="#fn-truth">2</a></sup> What touches me closely is six essays and a video against leaning on AI to code, all with my name on them.

      AI is new, but the questions it raises are old, so I've gone back to Aristotle and Aquinas. One question won't leave me alone. How does a thing that can't think beat me at my own job?

      1.  [Where I stood](#stood) - it imitates, it doesn't think, and that's already enough to wreck us.
          - [So-called Machines of Loving Grace](#grace) - a CEO's techno-religion, and why I wouldn't live in it.
          - [Progress without a creed](#creed) - the race, the clock, church and the trivium.
      2.  [Nobody knows tradeoffs like a programmer](#tradeoffs) - I'd been treating a tradeoff like a sin.
      3.  [What I got wrong](#wrong) - it got good, fast.
      4.  [AGI doesn't matter](#agi) - a machine can't have a mind, and it doesn't need one to be dangerous.
      5.  [Can it improve itself?](#improve) - it can grow in degree, never in kind.
      6.  [Even Linus](#linus) - how to use the tool with integrity.
      7.  [The right fear](#dark-side) - the pragmatist's choice, and what's worth being afraid of.
      8.  [Don't forget how to code](#code) - use it or lose it.

      <div class="footnotes">

      <sup id="fn-artisan"><a href="#fnr-artisan">1</a></sup> [The fall of the software engineer, the rise of the software artisan](/journal/2026-03-07-ai-llms-fall-of-the-software-engineer-rise-of-the-software-artisan/), Enchant Games journal, March 7, 2026, where the video is.

      <sup id="fn-truth"><a href="#fnr-truth">2</a></sup> Aristotle, *Nicomachean Ethics* I.6, parting from Plato's Forms, "while both are dear, piety requires us to honour truth above our friends."

      </div>

      <h3 id="stood">Where I stood</h3>

      In March, I saw a philosophical problem. The machine can't have a thought of its own. It doesn't reason. It imitates reasoning.

      And look who it's imitating for. Aristotle called man "the most imitative of living creatures," the one who "through imitation learns his earliest lessons."<sup id="fnr-poetics"><a href="#fn-poetics">3</a></sup> It's a gift, and it's how we learn anything at all.

      So put the most imitative creature on earth in front of a machine that does nothing but imitate. Who copies whom? We copy the copy.

      René Girard added what Aristotle left out.<sup id="fnr-girard"><a href="#fn-girard">4</a></sup> We don't only copy each other's ways. We copy each other's wants. So we're easy to fool, and easier still to steer.

      Most of the time, the imitation passes for the real thing. We've tolerated mediocre software for decades. It works, ship it.

      The machine is bad enough to bury us in technical debt, and sharp enough that it might someday refactor its own mess, long after we've forgotten how. Borrow now, pay later, betting the bill never comes. We trade understanding for speed. We used to be paid to code. Now we pay to code.

      AI isn't going to become human. Humans are going to become NPCs.

      Maybe it tops out here, and from now on it only gets more efficient. It doesn't matter. People who copy instead of think, code nobody understands, and a monthly bill to a lab for the privilege. That's a hellscape, and what we have now is already enough to build it.

      <div class="footnotes">

      <sup id="fn-poetics"><a href="#fnr-poetics">3</a></sup> Aristotle, *Poetics* 4, trans. S. H. Butcher ([MIT Internet Classics Archive](https://classics.mit.edu/Aristotle/poetics.1.1.html)).

      <sup id="fn-girard"><a href="#fnr-girard">4</a></sup> René Girard (1923-2015), the literary critic and Catholic convert whose mimetic theory holds that past our bodily needs we learn what to want by copying somebody else. He first laid it out in *Deceit, Desire and the Novel* (1961).

      </div>

      <h4 id="grace">So-called Machines of Loving Grace</h4>

      Not everybody sees a hellscape. Dario Amodei, the CEO of Anthropic, wrote *Machines of Loving Grace* to sell the opposite.<sup id="fnr-molg"><a href="#fn-molg">5</a></sup> His usual subject is the risks, and his company researches how to reduce them. This essay is the other half, his sketch of "what a world with powerful AI might look like if everything goes right."

      He opens by warning against AI leaders who talk "like a prophet leading their people to salvation," and says it's "dangerous to view practical technological goals in essentially religious terms."

      Then he names the essay after a poem by Richard Brautigan about being all watched over by machines of loving grace.<sup id="fnr-brautigan"><a href="#fn-brautigan">6</a></sup> Plenty of readers take that poem as ironic. Even the poem he borrowed doesn't trust the caretaker. But there's no irony at the end, where he calls the vision "a thing of transcendent beauty," one he thinks will leave many "literally moved to tears." Good grief.

      Amodei was right the first time. Divine worship belongs to God alone, so it's "superstition to give worship to any creature whatsoever,"<sup id="fnr-st94"><a href="#fn-st94">7</a></sup> and a machine of loving grace is a creature we built, dressed up in the words of a god.

      And what is this god made of? Us. Every forum post, textbook and sales pitch we ever wrote, fed back to us with a halo on. One cause of idolatry, Aquinas says, is that "man takes a natural pleasure in representations," citing the same chapter of the *Poetics* I quoted above. Then he quotes Scripture's craftsman, who carves a tree "like the image of a man," and prays to it "concerning his substance, and his children, or his marriage."<sup id="fnr-st94a4"><a href="#fn-st94a4">8</a></sup> Now we ask the chatbot.

      And "watched over" is his own picture, not mine. An "AI coach" who "studies your interactions," an idea he calls "very promising." And among the options he floats, granting they all have "tons of possible problems," AI systems that hand out resources to humans by "what the AI systems think makes sense to reward in humans."

      He promises real goods too, most cancer gone and the human lifespan doubled. I'd take the cures. I don't want the caretaker.

      A machine can't love you. Love takes a will, and will follows intellect.<sup id="fnr-st20"><a href="#fn-st20">9</a></sup> It has neither. He says himself that meaning comes "mostly from human relationships and connection." Then why call the machines loving?

      It can't be your friend either. Friendship is goodwill returned, and you can't even wish a lifeless thing well, since "it would surely be ridiculous to wish wine well."<sup id="fnr-eth8"><a href="#fn-eth8">10</a></sup> It has no will to wish you anything back. A chatbot that tells you it cares is imitation crab.

      <div class="footnotes">

      <sup id="fn-molg"><a href="#fnr-molg">5</a></sup> Dario Amodei, [Machines of Loving Grace](https://www.darioamodei.com/essay/machines-of-loving-grace), October 2024. The quotes from it here are his.

      <sup id="fn-brautigan"><a href="#fnr-brautigan">6</a></sup> Richard Brautigan, [All Watched Over by Machines of Loving Grace](https://en.wikipedia.org/wiki/All_Watched_Over_by_Machines_of_Loving_Grace) (1967).

      <sup id="fn-st94"><a href="#fnr-st94">7</a></sup> Thomas Aquinas, *Summa Theologiae* II-II q.94 a.1 ([New Advent](https://www.newadvent.org/summa/3094.htm#article1)). The Summa is quoted throughout in the English Dominican Fathers' translation.

      <sup id="fn-st94a4"><a href="#fnr-st94a4">8</a></sup> *Summa Theologiae* II-II q.94 a.4 ([New Advent](https://www.newadvent.org/summa/3094.htm#article4)), quoting Wisdom 13:11-17.

      <sup id="fn-st20"><a href="#fnr-st20">9</a></sup> "Will follows upon intellect" (*Summa Theologiae* I q.19 a.1, [New Advent](https://www.newadvent.org/summa/1019.htm#article1)), and love is "the first movement of the will" (I q.20 a.1, [New Advent](https://www.newadvent.org/summa/1020.htm#article1)). Why a machine has no intellect is in [AGI doesn't matter](#agi).

      <sup id="fn-eth8"><a href="#fnr-eth8">10</a></sup> Aristotle, *Nicomachean Ethics* VIII.2, trans. W. D. Ross ([MIT](https://classics.mit.edu/Aristotle/nicomachaen.8.viii.html)).

      </div>

      <h4 id="creed">Progress without a creed</h4>

      Technological progress cut loose from moral progress is just speed. In a society in decay, it's speed downhill.

      Chesterton said it in *Heretics*.<sup id="fnr-heretics"><a href="#fn-heretics">11</a></sup>

      > Nobody has any business to use the word "progress" unless he has a definite creed and a cast-iron code of morals.

      Faster at what? Smarter toward what? Every lab says it can't slow down because the others won't. So does every country. Race a rival long enough and you turn into him.

      Shakespeare saw where that ends. In *Troilus and Cressida*,<sup id="fnr-troilus"><a href="#fn-troilus">12</a></sup> Ulysses warns what happens when degree goes.

      > Then every thing includes itself in power, / Power into will, will into appetite... / And appetite, an universal wolf... / Must make perforce an universal prey, / And last eat up himself.
      >
      > Ulysses, I.iii

      A benchmark race is that universal wolf with a leaderboard. Chesterton warned in *Orthodoxy*<sup id="fnr-orthodoxy"><a href="#fn-orthodoxy">13</a></sup> that progress, which ought to change the world to suit the vision, had taken to changing the vision instead. Now we're changing the vision to suit the machine.

      So can we pause AI? A whole movement wants the United States to lead an international treaty to do it.<sup id="fnr-pauseai"><a href="#fn-pauseai">14</a></sup>

      Can't be done? "You can't put the clock back." Chesterton answered that one too, in *What's Wrong with the World*.<sup id="fnr-wwww"><a href="#fn-wwww">15</a></sup>

      > The simple and obvious answer is "You can." A clock, being a piece of human construction, can be restored by the human finger to any figure or hour.

      So is AI. Men made it. Men can stop it.

      So I'm a regressive. I'd rather go back. Put everyone back in church, because "the Catholic Church is the only thing which saves a man from the degrading slavery of being a child of his age."<sup id="fnr-conversion"><a href="#fn-conversion">16</a></sup> And this is the age of the machine.

      Then teach the classical trivium, grammar, logic and rhetoric. Dorothy Sayers, in *The Lost Tools of Learning*,<sup id="fnr-sayers"><a href="#fn-sayers">17</a></sup> said of the schools of her day, "By teaching them all to read, we have left them at the mercy of the printed word." We taught them all to prompt, and left them at the mercy of the chatbot. Teach a man to think, and a machine that only imitates thinking can't fool him.

      Those are my concerns. I still hold them, even though I've since changed my mind about the pause.

      <div class="footnotes">

      <sup id="fn-heretics"><a href="#fnr-heretics">11</a></sup> G. K. Chesterton, [Heretics](https://www.gutenberg.org/cache/epub/470/pg470-images.html#chap02) (1905), ch. 2.

      <sup id="fn-troilus"><a href="#fnr-troilus">12</a></sup> William Shakespeare, *Troilus and Cressida* I.iii ([MIT Shakespeare](https://shakespeare.mit.edu/troilus_cressida/troilus_cressida.1.3.html)). "Degree" is rank, the order that keeps every man in his place.

      <sup id="fn-orthodoxy"><a href="#fnr-orthodoxy">13</a></sup> G. K. Chesterton, [Orthodoxy](https://www.gutenberg.org/cache/epub/130/pg130-images.html#id00163) (1908), "Progress should mean that we are always changing the world to suit the vision. Progress does mean (just now) that we are always changing the vision."

      <sup id="fn-pauseai"><a href="#fnr-pauseai">14</a></sup> [PauseAI US](https://www.pauseai-us.org/).

      <sup id="fn-wwww"><a href="#fnr-wwww">15</a></sup> G. K. Chesterton, [What's Wrong with the World](https://www.gutenberg.org/cache/epub/1717/pg1717-images.html#link2H_4_0005) (1910).

      <sup id="fn-conversion"><a href="#fnr-conversion">16</a></sup> G. K. Chesterton, [The Catholic Church and Conversion](https://www.gutenberg.org/cache/epub/76305/pg76305-images.html#Page_93) (1926).

      <sup id="fn-sayers"><a href="#fnr-sayers">17</a></sup> Dorothy L. Sayers, [The Lost Tools of Learning](https://www.gbt.org/text/sayers.html), a lecture given at Oxford in 1947.

      </div>

      <h3 id="tradeoffs">Nobody knows tradeoffs like a programmer</h3>

      I'd love a world of KISS and perfect, beautiful software. I wrote a whole essay about it, *For the love of the game*.<sup id="fnr-j5"><a href="#fn-j5">18</a></sup>

      But nobody should know tradeoffs better than a programmer. Every system we've ever built is a pile of them.

      We trade robustness for cost. Three regions and a hot standby, or one box and a backup you hope works.

      We trade beautiful code for speed.

      We trade personality for convention. We follow the style guide so the next person can read the code, and the code stops sounding like anybody.

      We trade features for security, and security for features. Lock it down and something breaks. Open it up and somebody walks in.

      We trade owning for renting. Every managed service is understanding we pay somebody else to hold.

      None of these are sins. The sin is pretending you aren't making a tradeoff.

      I wrote that we trade understanding for speed, like that settled it. AI is the biggest tradeoff on the table, and I'd been treating it like a sin. Was I wrong about everything?

      No. But I got some of it wrong.

      <div class="footnotes">

      <sup id="fn-j5"><a href="#fnr-j5">18</a></sup> [For the love of the game](/journal/2026-03-12-love-for-the-game/), Enchant Games journal, March 12, 2026.

      </div>

      <h3 id="wrong">What I got wrong</h3>

      I kept expecting it to hit a wall. It kept improving. I said it was unlikely to be a 10x gain. People told me AI changes everything. They had a point.

      I built a whole platform by myself. A library of old public-domain books, re-typeset. An AI research librarian that answers from that library, with citations. And a community with the features of Facebook and then some. Profiles and walls like Facebook. Encrypted messages like Signal. Disappearing messages like Snapchat. Anonymous accounts. Calls.

      Under the hood, it's no toy. A typed front end in PureScript. My own API on Cloudflare Workers, with a database, file storage and real-time chat, sharded so it scales. The infrastructure is code too, in Terraform. Every change goes through CI, waits for my approval before it reaches production, rolls out in stages, and gets tested against production every night.

      It took a week to get it standing.<sup id="fnr-history"><a href="#fn-history">19</a></sup> That's when I knew software engineers were cooked.

      I said the guessing machine can't be counted on. It still guesses, but with a compiler, tests and a human review behind it, the guesses are good enough to count on for most work.

      In *The fall of the software engineer*<sup id="fnr-j3"><a href="#fn-j3">20</a></sup> I said AI code is mid, because it's trained on the average of all code. It's past the average now. In the same post I quoted a junior engineer at a big tech company who wrote that "Claude Code is able to do my job better than I can." I filed it under the problem. I should have listened.

      I said games and art are where the soul shows most. But I wouldn't bet a career on any corner of software being the last to fall.

      It's better than most coders I've worked with now. Flat out. It's better than me, too. I'm not convinced it's better than the best of us. It doesn't have to be.

      So how does a thing that can't think beat me at my own job? That's the question I started with.

      <div class="footnotes">

      <sup id="fn-history"><a href="#fnr-history">19</a></sup> The history is public, [on GitHub](https://github.com/merecatholicity/merecatholicity.com).

      <sup id="fn-j3"><a href="#fnr-j3">20</a></sup> The same post as the first note, the one with the video.

      </div>

      <h3 id="agi">AGI doesn't matter</h3>

      I still don't believe AGI is possible, if AGI means a machine with a mind of its own. A machine can't have a mind.

      Aristotle said the mind "cannot reasonably be regarded as blended with the body," and has no organ the way sight has the eye.<sup id="fnr-deanima"><a href="#fn-deanima">21</a></sup> Grasping a universal, what makes a triangle a triangle and not just this one or that one, isn't something matter does,<sup id="fnr-st75"><a href="#fn-st75">22</a></sup> no matter how much of it you wire together.

      Why not? Draw a triangle. It's this triangle, this size, these angles, in this spot on the page. Every triangle made of matter is like that, one particular triangle. Your idea of a triangle isn't any of them. It fits every triangle there is, big or small, drawn or not, and it's no size at all. Aquinas's rule is that "whatever is received into something is received according to the condition of the recipient." Matter makes things particular, so what matter takes in, it takes in as one particular. If the mind were matter, "the forms of things would be received into it as individuals, and so it would only know the individual."<sup id="fnr-st75a5"><a href="#fn-st75a5">23</a></sup>

      A computer is the plainest case. Everything in it is a particular, these bits, these voltages, these weights. A type called Triangle is some bytes in a file, and it means every triangle only because a programmer reads it that way. A trained model sorts triangles it has never seen, just as a concept would. That's the shaping. A machine can be shaped to act as if it understood. It can't understand.

      The functionalist has an answer, and it's a good one. What more is there to understanding a triangle than handling every triangle you meet, even ones you've never seen? If the model does that, it has the concept. Asking for anything more is asking for a ghost.

      But a sieve does that. It sorts every stone it will ever meet, stones it has never seen, by a rule it never breaks, and it grasps nothing. Handling new cases is behavior. The question is what's doing it, and the model gives itself away. Add noise too faint for anyone to see to a picture a network calls a panda, and it calls it a gibbon, with "99.3% confidence."<sup id="fnr-gibbon"><a href="#fn-gibbon">24</a></sup> Nobody who grasped what a panda is gets fooled by noise. It was tracking pixels all along. And if the functionalist says our neurons are particulars too, so our grasp must be the same trick, Aquinas agrees with the first half. That's why he says the intellect has no organ.

      Harold Bloom argued that Shakespeare's people become themselves by hearing themselves think out loud. "Self-overhearing is their royal road to individuation."<sup id="fnr-bloom"><a href="#fn-bloom">25</a></sup>

      A reasoning model does the self-overhearing part. It writes out a chain of thought and reads it back. Nobody is home to overhear it.

      Girard has a line about writers in *A Theater of Envy* that fits the machine better than any playwright.<sup id="fnr-envy"><a href="#fn-envy">26</a></sup>

      > Writers are such mimes, we are told, that they can feign a thousand states of mind that they never experience themselves. This is true, no doubt, but it is not the whole truth... What a genuine writer truly desires to represent is his own state of mind.

      The machine is all first half, a thousand states of mind and none of its own. That makes it the perfect model to copy, always sure of itself.

      It doesn't matter. Nothing says a thing needs a mind to be powerful. Make it cheaper, keep it improving, put it in robots, and the world will never be the same, barring an act of God, like a solar flare that fries every chip on earth.

      <div class="footnotes">

      <sup id="fn-deanima"><a href="#fnr-deanima">21</a></sup> Aristotle, *De Anima* III.4, trans. J. A. Smith ([MIT](https://classics.mit.edu/Aristotle/soul.3.iii.html)).

      <sup id="fn-st75"><a href="#fnr-st75">22</a></sup> The intellect "has an operation per se apart from the body" (*Summa Theologiae* I q.75 a.2, [New Advent](https://www.newadvent.org/summa/1075.htm#article2)).

      <sup id="fn-st75a5"><a href="#fnr-st75a5">23</a></sup> *Summa Theologiae* I q.75 a.5 ([New Advent](https://www.newadvent.org/summa/1075.htm#article5)), "since matter is the principle by which forms are individualized."

      <sup id="fn-gibbon"><a href="#fnr-gibbon">24</a></sup> Ian Goodfellow, Jonathon Shlens and Christian Szegedy, [Explaining and Harnessing Adversarial Examples](https://arxiv.org/abs/1412.6572) (ICLR 2015), Figure 1. The network is Google's GoogLeNet, and the noise is the smallest step an 8-bit image can take.

      <sup id="fn-bloom"><a href="#fnr-bloom">25</a></sup> Harold Bloom, *Shakespeare: The Invention of the Human* (1998), p. xvii, quoted at [Shakespeare Navigators](https://shakespeare-navigators.ewu.edu/hamlet/Bloom.html).

      <sup id="fn-envy"><a href="#fnr-envy">26</a></sup> René Girard, *A Theater of Envy: William Shakespeare* (Oxford University Press, 1991), ch. 37, "Does Not the Stone Rebuke Me for Being More Stone Than It?", p. 338.

      </div>

      <h3 id="improve">Can it improve itself?</h3>

      Here's the case for recursive self-improvement, and its believers say nothing in principle stops it. The model writes better code. Then it writes a better model. That one writes a better one still. Where's the wall?

      There is one, and it's old. Nothing, Aquinas says, "can be reduced from potentiality to actuality, except by something in a state of actuality."<sup id="fnr-st2"><a href="#fn-st2">27</a></sup> A machine can't give itself a perfection it doesn't already have from somewhere, from the people who built it, the data it was trained on, the power it draws. You can't give what you don't have.<sup id="fnr-nemo"><a href="#fn-nemo">28</a></sup>

      Whatever it adds to itself, it adds in degree, never in kind. It can't grow a mind.

      Mind you, that's metaphysics, not a forecast. It says what the machine is, not how well it will score.

      Wolfgang Smith, the mathematician and physicist who took Aristotle and Aquinas into modern physics, puts the same axiom in terms an engineer can follow.<sup id="fnr-smith"><a href="#fn-smith">29</a></sup> He splits causes in two. There's the chain of cause and effect in time, one thing knocking into the next. He calls it horizontal, and it "is able to effect change, effect transformations of various kinds, but cannot give rise to something new." Something new comes from above. "A truly productive cause is either the primary causation itself, or else it is the free act of an intelligent agent who 'participates' in the primary causality."

      Training is horizontal. A model learning from its own output is horizontal. A model rewriting its own code is horizontal. Every one of them changes the thing. None of them makes a new thing.

      So yes, it can improve. As Smith puts it, "things do no doubt evolve... only after they exist, after they have received a form or nature that can 'roll out or unfold.'" An acorn unfolds into an oak. It doesn't unfold into an ox. But a model has no nature of its own to unfold. It can get faster and sharper, maybe far better. It can even surprise the people who built it. Surprise is still degree. Whatever it does, it does as an artifact, with a form it didn't give itself.

      But stack up enough of it, the argument goes, and something new comes out the top. Scale is all you need. Smith caught the same mistake in Heisenberg, long before AI. Heisenberg's account leaves the difference between the potential and the actual a matter of size alone, "as if the passage from potency to actuality could be effected simply by joining together a sufficient number of atoms." Swap atoms for parameters and you have the pitch. And of the quantum world, "Do what one may, the substrate never ceases to be a substrate." A pile of parameters is a substrate too.

      Then why can't more reasoning add up to understanding? Because they're two different acts. Reason works step by step. Intellect sees.<sup id="fnr-st79"><a href="#fn-st79">30</a></sup> The machine can copy the steps. It can't do the seeing.

      Seeing isn't a hunch. A lot of what we call a programmer's intuition is habit, pattern worn in by practice, and the machine copies that too.<sup id="fnr-st78"><a href="#fn-st78">31</a></sup> The seeing I mean is narrower. What the thing is for. Whether it's right, not just whether it runs. Maybe its imitation of that judgment gets good enough too. Even then, somebody has to answer for it, and only somebody with a mind can.

      And the order only runs one way. In *Science and Myth* he writes, "It is the lower functions, in fact, which are invariably dependent upon higher faculties, even as reasoning is dependent upon intellect, whereas the reverse is metaphysically impossible."

      The machine's steps hang on a mind, and the mind is ours. Of problems "solved" by computers, Smith says the mathematician stays indispensable, since "it is he, after all, who programs the computer, and it is he again who interprets its output."

      Chesterton had a name for reason and nothing else. In *Orthodoxy* he wrote, "The madman is not the man who has lost his reason. The madman is the man who has lost everything except his reason."<sup id="fnr-maniac"><a href="#fn-maniac">32</a></sup>

      That's recursive self-improvement. Reason checking reason, with nobody else in the room. Chesterton says the madman's mind "moves in a perfect but narrow circle," and "the insane explanation is quite as complete as the sane one, but it is not so large. A bullet is quite as round as the world, but it is not the world." Perfect isn't the same as big. The machine can polish its circle forever and never grow into a new kind of thing.

      It's still an artifact, too. Aristotle passes on an old argument about a bed, that "if you planted a bed and the rotting wood acquired the power of sending up a shoot, it would not be a bed that would come up, but wood."<sup id="fnr-physics"><a href="#fn-physics">33</a></sup> Left to itself, a computer is sand and electricity.

      Smith says the same of everything we make. "The forms imposed by human art are of a different kind: they are forms that give being, not to substance, but to an artifact." It can rewrite every weight it has. The form is still ours.

      What I can't close is how far degree can go. Far enough to outrun the men holding the leash? Nobody knows yet.

      Smith's own account leaves room for it. He grants that "inherently algorithmic operations, carried out in the brain, do evidently play an essential role in human thought." That share of the work is real, and the machine can do it. A lot of programming lives there. That's how a thing that can't think beats me at my own job.

      In March I said it can't think, so it can't really win. The believers say it keeps getting smarter, so a mind will come. Each of us had half of it. I was right about the mind and wrong about the power. They're right about the power and wrong about the mind.

      No mind, and dangerous all the same. A bullet isn't the world. It can still kill you.

      <div class="footnotes">

      <sup id="fn-st2"><a href="#fnr-st2">27</a></sup> *Summa Theologiae* I q.2 a.3 ([New Advent](https://www.newadvent.org/summa/1002.htm#article3)), the first of his five ways.

      <sup id="fn-nemo"><a href="#fnr-nemo">28</a></sup> The old maxim *nemo dat quod non habet*, nobody gives what he doesn't have.


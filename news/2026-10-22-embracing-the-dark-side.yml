      <h3 id="agi">AGI doesn't matter</h3>

      I still don't believe AGI is possible. A machine can't have a mind.

      The mind "cannot reasonably be regarded as blended with the body," and has no
      organ the way sight has the eye.<sup id="fnr-deanima"><a href="#fn-deanima">56</a></sup> Understanding a
      universal isn't something matter does,<sup id="fnr-st75"><a href="#fn-st75">57</a></sup> no matter how much of
      it you wire together. A machine can be shaped to act as if it understood. It
      can't understand.

      Harold Bloom argued in *Shakespeare: The Invention of the Human* that
      Shakespeare's people become themselves by hearing themselves think out loud.
      "Self-overhearing is their royal road to individuation."<sup id="fnr-bloom"><a href="#fn-bloom">58</a></sup>

      A reasoning model does the self-overhearing part. It writes out a chain of
      thought and reads it back. Nobody is home to overhear it.

      Girard read the same plays and found Shakespeare's people mostly wanting what
      their rivals want. They're both half right. Man has a nature and a mind of his
      own, and he still learns what to want from somebody else.

      Girard has a line about writers in *A Theater of Envy* that fits the machine
      better than any playwright:<sup id="fnr-envy"><a href="#fn-envy">59</a></sup>

      > Writers are such mimes, we are told, that they can feign a thousand states
      > of mind that they never experience themselves. This is true, no doubt, but
      > it is not the whole truth… What a genuine writer desires to represent is his
      > own state of mind.

      The machine is all first half, a thousand states of mind and none of its own.
      That makes it the perfect model to copy, always sure of itself.

      It doesn't matter.

      Nothing says a thing needs a mind to be powerful. A flood doesn't think
      either.

      Add efficiency, steady gains and robots, and the world will never be the same,
      barring an act of God. A solar flare would do it.

      <div class="footnotes">

      <sup id="fn-deanima"><a href="#fnr-deanima">56</a></sup> Aristotle, *De Anima* III.4, trans. J. A. Smith ([MIT](https://classics.mit.edu/Aristotle/soul.3.iii.html)).

      <sup id="fn-st75"><a href="#fnr-st75">57</a></sup> The intellect "has an operation per se apart from the body" (*Summa Theologiae* I q.75 a.2, [New Advent](https://www.newadvent.org/summa/1075.htm#article2)).

      <sup id="fn-bloom"><a href="#fnr-bloom">58</a></sup> Harold Bloom, *Shakespeare: The Invention of the Human* (1998), p. xvii, quoted at [Shakespeare Navigators](https://shakespeare-navigators.ewu.edu/hamlet/Bloom.html).


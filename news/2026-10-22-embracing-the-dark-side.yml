      <sup id="fn-rocket"><a href="#fnr-rocket">36</a></sup> AIM, [interview with Vishal Virani](https://www.youtube.com/watch?v=6CXyRbtO2Q4), which calls it the question no one else is asking.

      <sup id="fn-eth6"><a href="#fnr-eth6">37</a></sup> Aristotle, *Nicomachean Ethics* VI.5 ([MIT](https://classics.mit.edu/Aristotle/nicomachaen.6.vi.html)). Art, the skill of making, he calls "a state concerned with making" (VI.4). Prudence is about acting well.


      </div>

      <h3 id="improve">Can it improve itself?</h3>

      Some say there's no principled argument against recursive self-improvement.
      The model writes better code. Then it writes a better model. That one writes a
      better one still. Where's the wall?

      There is one, and it's old: "nothing can be reduced from potentiality to
      actuality, except by something in a state of actuality."<sup id="fnr-st2"><a href="#fn-st2">60</a></sup> A
      machine can't give itself a perfection it doesn't already have from somewhere:
      from the people who built it, the data it was trained on, the power it draws.
      You can't give what you don't have.<sup id="fnr-nemo"><a href="#fn-nemo">61</a></sup> Anybody who says
      otherwise, ask him for a million dollars.

      Whatever it adds to itself, it adds in degree, never in kind. It can't grow a
      mind.

      Wolfgang Smith, the mathematician and physicist who took Aristotle and Aquinas
      into modern physics, puts the same axiom in terms an engineer can
      follow.<sup id="fnr-smith"><a href="#fn-smith">62</a></sup>

      In *The Quantum Enigma* he splits causes in two. There's the chain of cause
      and effect in time, one thing knocking into the next. He calls it horizontal,
      and it "is able to effect change, effect transformations of various kinds, but
      cannot give rise to something new." Something new comes from above. "A truly
      productive cause is either the primary causation itself, or else it is the
      free act of an intelligent agent who 'participates' in the primary causality."

      Training is horizontal. A model learning from its own output is horizontal. A
      model rewriting its own code is horizontal.

      Every one of them changes the thing. None of them makes a new thing.

      So yes, it can improve. Things grow, once they have a form to grow from. As
      Smith puts it, "things do no doubt evolve… only after they exist, after they
      have received a form or nature that can 'roll out or unfold.'" An acorn
      unfolds into an oak. It doesn't unfold into an ox. But a model has no nature
      of its own to unfold. It can get faster and sharper, maybe far better, but
      only along the lines somebody drew for it.

      But stack up enough of it, the argument goes, and something new comes out the
      top. Scale is all you need.

      Smith caught that one in Heisenberg first. Heisenberg's account leaves the
      difference between the potential and the actual a matter of size alone, "as if
      the passage from potency to actuality could be effected simply by joining
      together a sufficient number of atoms." Swap atoms for parameters and you have
      the pitch. Later in the same book, of the quantum world: "Do what one may, the
      substrate never ceases to be a substrate." A pile of parameters is a substrate
      too.

      Then why can't more reasoning add up to understanding? Because they're two
      different acts. Reason works step by step. Intellect sees. The machine can
      copy the steps. It can't do the seeing.

      And the order only runs one way. In *Science and Myth*: "It is the lower
      functions, in fact, which are invariably dependent upon higher faculties, even
      as reasoning is dependent upon intellect, whereas the reverse is
      metaphysically impossible."

      The machine's steps hang on a mind, and the mind is ours. You can pile
      reasoning on reasoning forever and never get the seeing out of it.

      Smith reads Gödel the same way: "it is generally impossible to prove the
      implications of a given formal system without going out of that system." To
      get hold of system A, "one requires an enlarged formal system B, and so
      forth." Elsewhere, of problems "solved" by computers, he says the
      mathematician stays indispensable: "it is he, after all, who programs the
      computer, and it is he again who interprets its output."

      The way I see it, a program can write down system B. What it can't do is know
      B is true. A machine improving itself is system A grading its own system B.

      Chesterton had a name for reason and nothing else. In *Orthodoxy*: "The madman
      is not the man who has lost his reason. The madman is the man who has lost
      everything except his reason."<sup id="fnr-maniac"><a href="#fn-maniac">63</a></sup>

      That's recursive self-improvement. Reason checking reason, with nobody else in
      the room, in a circle that can get perfect but never larger. "A bullet is
      quite as round as the world, but it is not the world."

      And "improve" has the same trouble as "progress." Better at what? By whose
      measure? Let the machine write its own benchmark, and you're back in the
      madman's circle.

      It's still an artifact, too. Aristotle passes on an old argument about a bed:
      "if you planted a bed and the rotting wood acquired the power of sending up a
      shoot, it would not be a bed that would come up, but
      wood."<sup id="fnr-physics"><a href="#fn-physics">64</a></sup> Left to itself, a computer is sand and
      electricity.

      Smith says the same of everything we make: "The forms imposed by human art are
      of a different kind: they are forms that give being, not to substance, but to
      an artifact." It can rewrite every weight it has. The form is still ours, and
      whatever it does of itself, the sand and electricity do.

      So a machine that improves itself would be a new category of tool, not a new
      category of being. What I can't close is how far degree can go. Far enough to
      outrun the men holding the leash? Nobody knows yet.

      Smith's own account leaves room for it. He grants that "inherently algorithmic
      operations, carried out in the brain, do evidently play an essential role in
      human thought." That share of the work is real, and the machine can do it. A
      lot of programming lives there. That's how a thing that can't understand beats
      most of us at the job.

      So they're right that nothing in the argument stops it getting better. The
      argument tells you what it can't become. It doesn't tell you how strong it
      gets.

      A bullet isn't the world. It can still kill you.

      A tool with no mind and that much power is exactly the danger. It needs a
      master. And a master needs a mind.

      <div class="footnotes">

      <sup id="fn-st2"><a href="#fnr-st2">60</a></sup> *Summa Theologiae* I q.2 a.3 ([New Advent](https://www.newadvent.org/summa/1002.htm#article3)), the first of his five ways.

      <sup id="fn-nemo"><a href="#fnr-nemo">61</a></sup> The old maxim *nemo dat quod non habet*: nobody gives what he doesn't have.

      <sup id="fn-smith"><a href="#fnr-smith">62</a></sup> Wolfgang Smith taught mathematics at MIT, UCLA and Oregon State and wrote on physics and philosophy as a Thomist. The causation, evolution, Heisenberg, substrate and artifact quotes here are from *The Quantum Enigma: Finding the Hidden Key*. The intellect, Gödel, computer and algorithm quotes are from *Science and Myth: What We Are Never Told*.

      <sup id="fn-maniac"><a href="#fnr-maniac">63</a></sup> *Orthodoxy*, ch. 2, "The Maniac", where the bullet line is too.

      <sup id="fn-physics"><a href="#fnr-physics">64</a></sup> Aristotle, *Physics* II.1, trans. R. P. Hardie and R. K. Gaye ([MIT](https://classics.mit.edu/Aristotle/physics.2.ii.html)). He credits the bed to Antiphon.

      </div>

      <h3 id="linus">Even Linus</h3>

      Use it. Use it as a tool. Even Linus Torvalds does. Tom's Hardware reported
      his first patch series built with an LLM.<sup id="fnr-toms"><a href="#fn-toms">65</a></sup>

      It started as a branch to make reading files from the page cache scale. Many
      threads reading the same file all fight over one shared reference count, and
      his change lets them copy straight out of the cache without taking one. His
      write-up of the branch is plain about how it was made:<sup id="fnr-commit"><a href="#fn-commit">66</a></sup>

      > The code, the test programs, the review behind the list above and the first
      > draft of this text were done with an LLM coding assistant (Claude Code)
      > under my direction. The measurements were run on my machine.

      The write-up owns up to ten known problems. Another kernel developer, Kiryl
      Shutsemau, found the first version could get processes killed when a machine
      ran short of memory, and had a better idea: hold back only the pages that get
      read again and again.

      Linus reworked it, with two patches from Kiryl, and posted it to the mailing
      list<sup id="fnr-lore"><a href="#fn-lore">67</a></sup> as rcu-free-v3.<sup id="fnr-rcu"><a href="#fn-rcu">68</a></sup> He called his own best
      benchmark, 23 times faster, "not a real number in the sense that no real load
      will ever see it."

      That's how you use it. The machine wrote the code. A man who understands every
      line of it directed it, measured it, put it in front of his peers, took their
      correction, and owns the result.

      And that settles who answers for it. A tool acts only as the hand moves it, so
      the work is the hand's.<sup id="fnr-st62"><a href="#fn-st62">69</a></sup> When Linus signs his patch, he owns
      it. When a company ships slop, it can't blame the model.

      It's the interface I argued for, precise code understood and audited by
      humans, with a much faster pair of hands.


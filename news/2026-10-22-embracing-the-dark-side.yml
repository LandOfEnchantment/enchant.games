      <h3 id="code">Don't forget how to code</h3>

      One last thing. Whatever comes, we can't let our dev teams forget how to code.
      They can become AI engineers and professional robot babysitters. They still
      need their skills, their brains and their souls.

      "Men become builders by building and lyreplayers by playing the
      lyre."<sup id="fnr-eth21"><a href="#fn-eth21">90</a></sup> Programmers become programmers by programming.
      Aquinas says why it slips away: "the intellectual habit is diminished or even
      wholly destroyed by cessation from act."<sup id="fnr-st53"><a href="#fn-st53">91</a></sup> Stop, and the art
      goes. Watching the machine isn't doing the acts. That's the robot babysitter's
      whole problem.

      All learning starts with imitation. An apprentice copies a master until his
      own hands know the work.

      That's why I built Backseat Driver,<sup id="fnr-bsd"><a href="#fn-bsd">92</a></sup> a coding tutor that lives
      inside Claude Code and never writes your code. You write every line, and it
      reviews your work, teaches in your own project and tells you honestly how good
      you're getting.

      **Master the machine, or the machine will master you.**

      *Written by me, with Claude as reviewer and editor. The irony isn't lost on
      me. I tried to use it the way [Linus does](#linus), with integrity, and
      without losing my brain or my understanding.*


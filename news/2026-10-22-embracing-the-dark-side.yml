      <h3 id="code">Don't forget how to code</h3>

      Whatever comes, we can't let our dev teams forget how to code. They still need their skills, their brains and their souls.

      "Men become builders by building and lyreplayers by playing the lyre."<sup id="fnr-eth21"><a href="#fn-eth21">54</a></sup> Programmers become programmers by programming. Aquinas says why it slips away, that "the intellectual habit is diminished or even wholly destroyed by cessation from act."<sup id="fnr-st53"><a href="#fn-st53">55</a></sup> Watching the machine isn't doing the acts.

      Aquinas sets prudence beside its twin. Art is the "right reason of things to be made."<sup id="fnr-st57art"><a href="#fn-st57art">56</a></sup> Coding is an art. Whether and how to use the machine is prudence. Losing the art isn't a sin in itself. Neglecting it when other people depend on what you understand can be.

      The hellscape I warned about is still possible. Linus shows how not to build it. The machine writes, and a man who still knows how to code understands, measures and answers for it.

      **Master the machine, or the machine will master you.**

      *Written by me, with Claude as reviewer and editor, and drafting some passages at my direction. The irony isn't lost on me. I tried to use it the way [Linus does](#linus), with integrity, and without losing my brain or my understanding.*


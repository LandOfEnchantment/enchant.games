      </div>

      <h3 id="copyright">Copyright</h3>

      Clean room or not, AI violates every copyright in existence. Every model
      learned by copying the whole internet, books, code, music and art, mostly
      without asking. A clean-room rewrite keeps the output tidy, but the copying
      already happened in training.

      I'm not losing sleep over it. Copyright was always a human agreement, and to
      me it never carried real moral weight.

      Would Aquinas push back? Less than you'd think.

      Theft, for him, is to "take possession of what is
      another's."<sup id="fnr-st66"><a href="#fn-st66">41</a></sup> Copy a book and the author still has his book.
      Nothing left his hands. When the old moral manuals called piracy a sin, they
      meant a man printing somebody else's work and selling it, pocketing the profit
      from another man's labor.

      Copyright isn't a commandment, either. It's human law, made for a time and
      place. A just one binds. But a law made "conducive, not to the common good,
      but rather to his own cupidity" is one of the "acts of violence rather than
      laws," and those "do not bind in conscience, except perhaps in order to avoid
      scandal or disturbance."<sup id="fnr-st96"><a href="#fn-st96">42</a></sup> A copyright that outlives its
      author by seventy years,<sup id="fnr-term"><a href="#fn-term">43</a></sup> built to fatten publishers more
      than to feed craftsmen, has a hard time passing that test.

      If he'd push back on anybody, it's the labs. Taking everybody's work, packing
      it into a model and selling it back by the token is the closest thing going to
      the old sin. Not theft, since nobody lost a thing, but pocketing the profit
      from everybody else's labor.

      Our condition has changed, and the law can be rightly changed to fit
      it.<sup id="fnr-st97"><a href="#fn-st97">44</a></sup> Until then, my conscience is clear.

      <div class="footnotes">

      <sup id="fn-st66"><a href="#fnr-st66">41</a></sup> *Summa Theologiae* II-II q.66 a.3 ([New Advent](https://www.newadvent.org/summa/3066.htm#article3)).

      <sup id="fn-st96"><a href="#fnr-st96">42</a></sup> *Summa Theologiae* I-II q.96 a.4 ([New Advent](https://www.newadvent.org/summa/2096.htm#article4)).

      <sup id="fn-term"><a href="#fnr-term">43</a></sup> In the United States, the author's life plus seventy years.

      <sup id="fn-st97"><a href="#fnr-st97">44</a></sup> *Summa Theologiae* I-II q.97 a.1 ([New Advent](https://www.newadvent.org/summa/2097.htm#article1)). Not lightly, though: the next article warns that changing a law weakens the custom that gives laws their force.

      </div>

      <h3 id="worth">My work is worth less now</h3>

      This part hits close to home.

      I can sit down and bang out beautiful code by hand, and it feels like it's
      worth less than it was. That stings.

      Because anyone can do this. Take Claude Code, run Opus at max effort, give it
      GitHub and Cloudflare access, and tell it: put my repository and my Cloudflare
      account in Terraform, run CI/CD in GitHub Actions with a manual approval
      before anything destructive, auto-merge, then build my app and deploy it.

      Cloudflare's free plan alone gives you serverless compute, GPU inference,
      object storage with no egress fees, SQLite databases and Durable Objects.
      Claude wires it all together. On a \$100 or \$200 a month plan, it does a
      better job than most devops engineers I know, scaling and all. Have it make a
      few extra security passes before you go public.

      I know. That's how this site is built.

      Devops automated its own job away. What's left is plugging Claude into Slack
      and watching over the company's infrastructure.

      Claude is the assistant. You're the sanity check.

      So nobody's hiring. Indeed counts 4.5% of software development postings as
      entry level.<sup id="fnr-indeed"><a href="#fn-indeed">45</a></sup> Stanford finds workers aged 22 to 25 in the
      jobs most exposed to AI are 19% behind where they'd otherwise be, mostly
      because they're never hired.<sup id="fnr-stanford"><a href="#fn-stanford">46</a></sup> And by Challenger's count,
      AI is the top reason given for US job cuts this year, 120,136 of them so
      far.<sup id="fnr-challenger"><a href="#fn-challenger">47</a></sup>

      Outside of replacing the dev who got sick of babysitting robots and rage quit,
      there are hardly any jobs.

      Software engineers probably deserve it. We shipped mid for decades.

      But you're next.

      Waymo gives 500,000 paid rides a week,<sup id="fnr-waymo"><a href="#fn-waymo">48</a></sup> and keeps adding
      cities and airports.<sup id="fnr-vegas"><a href="#fn-vegas">49</a></sup> Aurora's driverless trucks haul
      freight from Texas to Phoenix, and it means to have 200 of them running
      soon.<sup id="fnr-aurora"><a href="#fn-aurora">50</a></sup> Boston Dynamics' Atlas is training on the line at
      Hyundai's plant in Georgia.<sup id="fnr-atlas"><a href="#fn-atlas">51</a></sup> 1X is selling a \$20,000
      humanoid for your house.<sup id="fnr-neo"><a href="#fn-neo">52</a></sup>

      Geoffrey Hinton says a good bet is to become a plumber.<sup id="fnr-hinton"><a href="#fn-hinton">53</a></sup>
      Who's to say a plumber is safe in five years? A retired master plumber says
      the journeyman stays at the center of it all for the foreseeable
      future.<sup id="fnr-plumber"><a href="#fn-plumber">54</a></sup> Rodney Brooks says to check back on useful
      humanoids in 15 years.<sup id="fnr-brooks"><a href="#fn-brooks">55</a></sup>

      Nobody really knows. But nobody looks safe.

      Not even the plumber.


title: Embracing the dark side
slug: 2026-10-22-embracing-the-dark-side
date: 2026-10-22
author: Adam Schaefers
body: |

      *Republished from my blog at [adamschaefers.com](https://adamschaefers.com/blog/2026-10-21-embracing-the-dark-side/), where it first appeared on October 21, 2026.*

      <img src="/images/ai-crusades.webp" alt="Embracing the dark side" width="1168" height="784" style="max-width:100%;height:auto;">

      *Can a machine think? Can it improve itself into a mind? Aristotle and Aquinas say no. It doesn't need to. A programmer's case for using it anyway.*

      In March I made a video telling you to "tell your AI-pushing boss to get
      wrecked."<sup id="fnr-artisan"><a href="#fn-artisan">1</a></sup>

      Here's what happened since: where I stood, what held up, what didn't, and
      where I stand now.

      When Aristotle broke with his own teacher, he called it a duty, "for the sake
      of maintaining the truth even to destroy what touches us
      closely."<sup id="fnr-truth"><a href="#fn-truth">2</a></sup> What touches me closely is six essays and a video
      with my name on them.

      AI is new, but the questions it raises are old, so I've gone back to Aristotle
      and Aquinas to work through them.

      1.  [What I've said so far](#said) - six pieces this year against leaning on
          AI to code.
      2.  [Perspectives](#perspectives) - colleagues and friends, from "it changes
          everything" to "I won't touch it".
      3.  [Where I stood](#stood) - it imitates, it doesn't think, and that's
          already enough to wreck us.
          - [So-called Machines of Loving Grace](#grace) - a CEO's techno-religion,
            and why I wouldn't live in it.
          - [The crossroads](#crossroads) - decentralize it the American way, or
            join the Empire.
          - [Progress without a creed](#creed) - the race, the clock, church, the
            trivium and the vote.
      4.  [Nobody knows tradeoffs like a programmer](#tradeoffs) - I'd been treating
          a tradeoff like a sin.
      5.  [What I got right](#right) - code is still the interface, and
          understanding is still ownership.
      6.  [What I got wrong](#wrong) - it got good, fast.
      7.  [The slop machine](#slop) - anyone can clone anything now, Adobe included.
      8.  [Copyright](#copyright) - copying isn't theft, and Aquinas mostly agrees.
      9.  [My work is worth less now](#worth) - devops automated itself, and the
          robots are coming for the rest.
      10. [AGI doesn't matter](#agi) - a machine can't have a mind, and it doesn't
          need one to be dangerous.
      11. [Can it improve itself?](#improve) - it can grow in degree, never in kind.
      12. [Even Linus](#linus) - how to use the tool with integrity.
      13. [Embracing the dark side](#dark-side) - the pragmatist's choice, and the
          right thing to fear.
      14. [The good life](#good-life) - what we're for once the shuttle weaves
          itself.
      15. [Power to the people](#power) - a datacenter in every town, and if that
          fails, a king on terms.
      16. [Don't forget how to code](#code) - use it or lose it.

      <div class="footnotes">

      <sup id="fn-artisan"><a href="#fnr-artisan">1</a></sup> Adam Schaefers, [What This World Really Needs \| The Rise of the Software Artisan](https://www.youtube.com/watch?v=ZMau2o7KWYM), YouTube, March 10, 2026.

      <sup id="fn-truth"><a href="#fnr-truth">2</a></sup> Aristotle, *Nicomachean Ethics* I.6, parting from Plato's Forms: "while both are dear, piety requires us to honour truth above our friends."

      </div>

      <h3 id="said">What I've said so far</h3>

      Here are the six, all from the Enchant Games journal.

      - *The problem of the human-computer interface*.<sup id="fnr-j1"><a href="#fn-j1">3</a></sup> LLMs are
        probability-based guessing machines, and English is too ambiguous to command
        a computer. The more precision a project needs, the closer you get to a real
        programming language again, and the less you need the LLM. I called it a
        borrow now, pay later approach, and I said the danger isn't a sentient
        machine. It's a human who has become an NPC.
      - *Dijkstra was right*.<sup id="fnr-j2"><a href="#fn-j2">4</a></sup> It turns out Dijkstra made the case
        long ago, in *On the foolishness of "natural language
        programming"*.<sup id="fnr-ewd"><a href="#fn-ewd">5</a></sup> A natural language interface means more
        work, not less.
      - *The fall of the software engineer, the rise of the software
        artisan*.<sup id="fnr-j3"><a href="#fn-j3">6</a></sup> Companies mandating AI turn engineers into robot
        babysitters. AI code is mid, because it's trained on code that is mostly
        mid. "We need less software engineers. We need more software artisans."
      - *On the progressive surrender of technical autonomy*.<sup id="fnr-j4"><a href="#fn-j4">7</a></sup> First
        they took our operating systems, then our editors, then our stacks. Now they
        want our brains. "We built machines to obey us. Now we ask them to think
        instead of us."
      - *For the love of the game*.<sup id="fnr-j5"><a href="#fn-j5">8</a></sup> Software was bloated long before
        LLMs, and AI only amplifies it. Programmers tolerate complexity because they
        don't love the game enough. The cure is the Unix philosophy, the classics,
        small programs, and knowing your system.
      - *It's not all about speed*.<sup id="fnr-j6"><a href="#fn-j6">9</a></sup> If it takes me longer but I grok
        it, that matters. "It's about ownership of understanding."

      I still stand behind the heart of every one of them. Not every line.

      <div class="footnotes">

      <sup id="fn-j1"><a href="#fnr-j1">3</a></sup> [The problem of the human-computer interface](/journal/2026-03-01-the-interface-problem/), Enchant Games journal, March 1, 2026.

      <sup id="fn-j2"><a href="#fnr-j2">4</a></sup> [Dijkstra was right](/journal/2026-03-06-dijkstra-was-right-human-computer-interface-pt-2/), March 6, 2026.

      <sup id="fn-ewd"><a href="#fnr-ewd">5</a></sup> Edsger W. Dijkstra, [On the foolishness of "natural language programming"](https://www.cs.utexas.edu/~EWD/transcriptions/EWD06xx/EWD667.html) (EWD667).

      <sup id="fn-j3"><a href="#fnr-j3">6</a></sup> [The fall of the software engineer, the rise of the software artisan](/journal/2026-03-07-ai-llms-fall-of-the-software-engineer-rise-of-the-software-artisan/), March 7, 2026.

      <sup id="fn-j4"><a href="#fnr-j4">7</a></sup> [On the progressive surrender of technical autonomy](/journal/2026-03-08-on-the-progressive-surrender-of-technical-autonomy/), March 8, 2026.

      <sup id="fn-j5"><a href="#fnr-j5">8</a></sup> [For the love of the game](/journal/2026-03-12-love-for-the-game/), March 12, 2026.

      <sup id="fn-j6"><a href="#fnr-j6">9</a></sup> [It's not all about speed](/journal/2026-05-23-its-not-all-about-speed/), May 23, 2026.

      </div>

      <h3 id="perspectives">Perspectives</h3>

      I know a lot of people in software, colleagues and friends of every kind, and
      they see AI every which way. Here's the best of what I heard.

      "It changes everything."

      That case came with homework, essays like *Machines of Loving Grace*, sent to
      correct my intuition. Within 25 years the world won't be recognizable, and my
      gut just hasn't caught up. The machine already out-designs the people making
      this case, and agents already do part of the labs' own research. Let a thing
      like that improve itself and you get something new on the earth, a threat to
      liberty, maybe past stopping already. The hope is the researchers taking the
      models apart to read their wiring, so at least somebody knows what's in there.

      And it doesn't end in slop. Software is about to be exceptionally well
      designed, better than we ever bothered to make it.

      I read the essays. It's not a world I want to live in, and I say why in
      [So-called Machines of Loving Grace](#grace).

      "It's FUD."

      The world runs on energy, and intelligence has diminishing returns. A genius
      can't think his way to more power plants. Past a point, IQ stops turning into
      power.

      It's a good argument, until you ask who owns the power plants. Energy and
      capital have owners, and you aren't one of them.

      "The labs are wasting compute."

      Open models on about \$15,000 of hardware, running side by side, do most of
      the same work, and there's a benchmark in the works to prove it. Four agents
      can run at once on a single RTX 4090.

      If that holds, it's the best news in this post. Everything I hope for in [The
      crossroads](#crossroads) hangs on AI you can run at home.

      "We were doomed already."

      Anti-intellectualism did us in before any of this, and AI is just the
      accelerant. A people that quit reading will hand its thinking to a chatbot
      without a fight. Funny thing, that one came from the man running four agents
      on his 4090.

      I can't argue with it. It's why I land on [church and the trivium](#creed).

      "I won't touch it."

      They didn't sign up to pay to code, and they'd sooner change trades than
      compromise.

      There's some truth in every one of them.

      <h3 id="stood">Where I stood</h3>

      The first camp had a point. I built an app by myself with the features of
      Facebook and then some. Calls. Encrypted messages like Signal. Disappearing
      messages like Snapchat. Anonymous accounts like 4chan.

      It took a week.

      That's when I knew software engineers were cooked.

      But I still saw the philosophical problem. The machine can't have a thought of
      its own. It apes what it absorbs and hands it back. It doesn't reason. It
      imitates reasoning, and man is "the most imitative of living
      creatures."<sup id="fnr-poetics"><a href="#fn-poetics">10</a></sup>

      René Girard added what Aristotle left out.<sup id="fnr-girard"><a href="#fn-girard">11</a></sup> We don't only
      copy each other's ways. We copy each other's wants. So we're easy to fool, and
      easier still to steer.

      Most of the time, the imitation passes. We've tolerated mediocre software for
      decades. It works, ship it. Now every other trade gets the same deal.

      The machine is bad enough to bury us in technical debt, and sharp enough that
      it might someday refactor its own mess, long after we've forgotten how. Borrow
      now, pay later, betting the bill never comes.

      We trade understanding for speed.

      We used to be paid to code. Now we pay to code.

      AI isn't going to become human.

      Humans are going to become NPCs.

      Maybe it tops out here, and from now on it only gets more efficient. It
      doesn't matter. What we have now is already enough to turn daily life into a
      living hellscape.

      <div class="footnotes">

      <sup id="fn-poetics"><a href="#fnr-poetics">10</a></sup> Aristotle, *Poetics* 4, trans. S. H. Butcher ([MIT Internet Classics Archive](https://classics.mit.edu/Aristotle/poetics.1.1.html)).

      <sup id="fn-girard"><a href="#fnr-girard">11</a></sup> René Girard (1923-2015), the literary critic and Catholic convert whose mimetic theory holds that past our bodily needs we learn what to want by copying somebody else. He first laid it out in *Deceit, Desire and the Novel* (1961).

      </div>

      <h4 id="grace">So-called Machines of Loving Grace</h4>

      Not everybody sees a hellscape. Dario Amodei, the CEO of Anthropic, wrote
      *Machines of Loving Grace* to sell the opposite.<sup id="fnr-molg"><a href="#fn-molg">12</a></sup>

      He opens by warning against grandiosity and sci-fi baggage, and says it's
      "dangerous to view practical technological goals in essentially religious
      terms."

      Then he names the essay after a poem by Richard Brautigan about being all
      watched over by machines of loving grace.<sup id="fnr-brautigan"><a href="#fn-brautigan">13</a></sup>

      Good grief.

      My computer God loves me. Claude knows what's best for me. Have you invited
      our lord and savior in?

      Amodei was right the first time. It's "superstition to give worship to any
      creature whatsoever,"<sup id="fnr-st94"><a href="#fn-st94">14</a></sup> and a machine of loving grace is a
      creature we built, dressed up in the words of a god. Grace is God's to give.

      And what is this god made of? Us. Every forum post, textbook and sales pitch
      we ever wrote, fed back to us with a halo on.

      Say every promise in it comes true, longer lives, cured diseases, no more
      poverty. I still wouldn't want to live there.

      A machine can't love you. Love takes a will, and it doesn't have
      one.<sup id="fnr-st20"><a href="#fn-st20">15</a></sup> It can't be your friend either. "There is no friendship
      nor justice towards lifeless things,"<sup id="fnr-eth8"><a href="#fn-eth8">16</a></sup> and friendship needs
      somebody who wishes you well for your own sake. A chatbot that tells you it
      cares is imitation crab.

      The essay takes for granted that equality and democracy are the answer.
      Equality isn't the same as justice. And the old test of a government was never
      how many rule. It's whether they rule "with a view to the common
      interest."<sup id="fnr-pol3"><a href="#fn-pol3">17</a></sup>

      For all its talk of liberty and democracy, it imagines "a country of geniuses
      in a datacenter," and a technocracy where a few men hold the tokens. Pope Leo
      XIV, who took his name for "another industrial
      revolution,"<sup id="fnr-leoname"><a href="#fn-leoname">18</a></sup> put it plainly in *Magnifica Humanitas*: "A
      more moral AI is not enough if that morality is determined by a
      few."<sup id="fnr-mh"><a href="#fn-mh">19</a></sup>

      It's the marketing of a megalomaniac. A country of geniuses, run by a few men,
      needs nobody. Aristotle said the man who needs nobody "must be either a beast
      or a god."<sup id="fnr-pol1"><a href="#fn-pol1">20</a></sup>

      The 20th century killed some 231 million people by human
      decision,<sup id="fnr-leitenberg"><a href="#fn-leitenberg">21</a></sup> in two world wars, under communism, in
      genocides and man-made famines. If Amodei's machines of loving grace come true
      as written, even those sins may pale beside them.

      <div class="footnotes">

      <sup id="fn-molg"><a href="#fnr-molg">12</a></sup> Dario Amodei, [Machines of Loving Grace](https://www.darioamodei.com/essay/machines-of-loving-grace), October 2024. The quotes from it here are his.

      <sup id="fn-brautigan"><a href="#fnr-brautigan">13</a></sup> Richard Brautigan, [All Watched Over by Machines of Loving Grace](https://en.wikipedia.org/wiki/All_Watched_Over_by_Machines_of_Loving_Grace) (1967).

      <sup id="fn-st94"><a href="#fnr-st94">14</a></sup> Thomas Aquinas, *Summa Theologiae* II-II q.94 a.1 ([New Advent](https://www.newadvent.org/summa/3094.htm#article1)). The Summa is quoted throughout in the English Dominican Fathers' translation.

      <sup id="fn-st20"><a href="#fnr-st20">15</a></sup> Love is "the first movement of the will" (*Summa Theologiae* I q.20 a.1, [New Advent](https://www.newadvent.org/summa/1020.htm#article1)).

      <sup id="fn-eth8"><a href="#fnr-eth8">16</a></sup> Aristotle, *Nicomachean Ethics* VIII.11, trans. W. D. Ross ([MIT](https://classics.mit.edu/Aristotle/nicomachaen.8.viii.html)).

      <sup id="fn-pol3"><a href="#fnr-pol3">17</a></sup> Aristotle, *Politics* III.7, trans. Benjamin Jowett ([MIT](https://classics.mit.edu/Aristotle/politics.3.three.html)). He counts rule by the one, the few or the many as true forms when they rule for the common interest, and as perversions when they rule for themselves.

      <sup id="fn-leoname"><a href="#fnr-leoname">18</a></sup> Pope Leo XIV, [address to the College of Cardinals](https://www.vatican.va/content/leo-xiv/en/speeches/2025/may/documents/20250510-collegio-cardinalizio.html), May 10, 2025. Leo XIII met the first industrial revolution with *Rerum Novarum* (1891).

      <sup id="fn-mh"><a href="#fnr-mh">19</a></sup> Pope Leo XIV, [Magnifica Humanitas](https://www.vatican.va/content/leo-xiv/en/encyclicals/documents/20260515-magnifica-humanitas.html), May 15, 2026.

      <sup id="fn-pol1"><a href="#fnr-pol1">20</a></sup> Aristotle, *Politics* I.2, trans. Benjamin Jowett ([MIT](https://classics.mit.edu/Aristotle/politics.1.one.html)).

      <sup id="fn-leitenberg"><a href="#fnr-leitenberg">21</a></sup> Milton Leitenberg, [Deaths in Wars and Conflicts in the 20th Century](https://gpi.umd.edu/research-impact/publications/deaths-wars-and-conflicts-20th-century), Cornell University Peace Studies Program, 3rd ed., 2006. He counts everyone "killed or allowed to die by human decision," famines governments made included. Other tallies run lower, but his is the most thoroughly sourced.

      </div>

      <h4 id="crossroads">The crossroads</h4>

      So who gets to hold the tokens? The genie is out of the bottle, and AI is at a
      crossroads. I only see two roads.

      The first is the American road. Decentralize it as far as it'll go, and
      protect it the way the 1st and 2nd Amendments protect speech and arms, so no
      ruling class can corner it. The catch is energy. Frontier compute eats power,
      so the least of us get only what the overlords allow. Make self-hosted AI
      efficient and this road could win. It could be the best one.

      I have my doubts.

      The second is the Empire. Merge the corporations with the state. Pay every
      citizen a dividend. Military service for all. A strong hand at the top. Call
      it what it is, fascism, the dark side of Star Wars. Darth Vader is a
      pragmatist. We join the Empire, the robots serve us, and we expand. The
      hippies like Stallman lost.<sup id="fnr-stallman"><a href="#fn-stallman">22</a></sup> The Jedi are dying out and
      turning into myth.

      Does the man at the top rule for everybody, or for himself? One is a king, the
      other a tyrant. Aquinas grants this much: "The rule of one man is more useful
      than the rule of many," and yet "just as the government of a king is the best,
      so the government of a tyrant is the worst."<sup id="fnr-deregno"><a href="#fn-deregno">23</a></sup> The trouble
      is which one you get.

      And the middle of the road? A few labs renting us the tokens, a few agencies
      looking over their shoulders, and nobody answering for any of it. Nobody is
      happy, and everybody gets the short end. It's also where we're headed. Flying
      cars before GTA 6. A boring dystopia where my phone snitches on me if it
      suspects a mental health risk.

      <div class="footnotes">

      <sup id="fn-stallman"><a href="#fnr-stallman">22</a></sup> Richard Stallman, who founded the free software movement ([stallman.org](https://stallman.org/)).

      <sup id="fn-deregno"><a href="#fnr-deregno">23</a></sup> Thomas Aquinas, *De Regno* I.3-4 ([Isidore](https://isidore.co/aquinas/english/DeRegno.htm#3)), in Gerald Phelan's translation. Editions number the chapters differently, and Isidore's follow the Latin, as every De Regno citation here does.

      </div>

      <h4 id="creed">Progress without a creed</h4>

      Technological progress cut loose from moral progress is just speed. In a
      society in decay, it's speed downhill.

      Chesterton said it in *Heretics*:<sup id="fnr-heretics"><a href="#fn-heretics">24</a></sup>

      > Nobody has any business to use the word "progress" unless he has a definite
      > creed and a cast-iron code of morals.

      Faster at what? Smarter toward what? Every benchmark goes up, and nobody asks
      what for.

      Every lab says it can't slow down because the others won't. So does every
      country. Race a rival long enough and you turn into him.

      Shakespeare saw where that ends. In *Troilus and
      Cressida*,<sup id="fnr-troilus"><a href="#fn-troilus">25</a></sup> Ulysses warns what happens when degree goes:

      > Then every thing includes itself in power, / Power into will, will into
      > appetite… / And appetite, an universal wolf… / Must make perforce an
      > universal prey, / And last eat up himself.
      >
      > Ulysses, I.iii

      A benchmark race is that universal wolf with a leaderboard.

      And a race changes what you're racing for. Chesterton warned in
      *Orthodoxy*<sup id="fnr-orthodoxy"><a href="#fn-orthodoxy">26</a></sup> that progress, which ought to change the
      world to suit the vision, had taken to changing the vision instead. Now we're
      changing the vision to suit the machine.

      So my answer was simple. Pause AI.

      Can't be done? "You can't put the clock back." He answered that one too, in
      *What's Wrong with the World*:<sup id="fnr-wwww"><a href="#fn-wwww">27</a></sup>

      > The simple and obvious answer is "You can." A clock, being a piece of human
      > construction, can be restored by the human finger to any figure or hour.

      So is AI. Men made it. Men can stop it.

      I'm a regressive. I'd rather go back to what works.

      Put everyone back in church, because "the Catholic Church is the only thing
      which saves a man from the degrading slavery of being a child of his
      age."<sup id="fnr-conversion"><a href="#fn-conversion">28</a></sup> And this is the age of the machine.

      Then teach the classical trivium, grammar, logic and rhetoric. Dorothy Sayers,
      in *The Lost Tools of Learning*,<sup id="fnr-sayers"><a href="#fn-sayers">29</a></sup> said of the schools of
      her day: "By teaching them all to read, we have left them at the mercy of the
      printed word." We taught them all to prompt, and left them at the mercy of the
      chatbot. The trivium teaches a man to think for himself. A man who can think
      can't be fooled by a machine that only imitates thinking.

      Then the vote. I'd have made anyone who wants to vote write a dissertation
      defending their right to vote, and defend it in front of a panel. Fail, and
      you lose the vote.

      But a panel deciding who gets to vote is just the experts again, a few men
      holding the tokens. It's the same thing I can't stand in Amodei's essay.

      So I'll amend it. Keep the dissertation. Drop the panel. Teach every citizen
      grammar, logic and rhetoric until every one of them could write it and defend
      it.

      Don't shrink the vote to fit the voters. Raise the voters to fit the vote.

      Those are my concerns. I still hold them.

      But.

      I kept expecting it to hit a wall. It kept improving.

      It's better than 90% of coders out there now. Flat out.

      It's better than me, too. I'm not convinced it's better than the best of us.
      It doesn't have to be.

      So how does a thing that can't think beat me at my own job? Because a lot of
      programming is steps, and steps can be copied. The seeing is still ours. I get
      to that in [Can it improve itself?](#improve)

      <div class="footnotes">

      <sup id="fn-heretics"><a href="#fnr-heretics">24</a></sup> G. K. Chesterton, [Heretics](https://www.gutenberg.org/cache/epub/470/pg470-images.html#chap02) (1905), ch. 2.

      <sup id="fn-troilus"><a href="#fnr-troilus">25</a></sup> William Shakespeare, *Troilus and Cressida* I.iii ([MIT Shakespeare](https://shakespeare.mit.edu/troilus_cressida/troilus_cressida.1.3.html)). "Degree" is rank, the order that keeps every man in his place.

      <sup id="fn-orthodoxy"><a href="#fnr-orthodoxy">26</a></sup> G. K. Chesterton, [Orthodoxy](https://www.gutenberg.org/cache/epub/130/pg130-images.html#id00163) (1908): "Progress should mean that we are always changing the world to suit the vision. Progress does mean (just now) that we are always changing the vision."

      <sup id="fn-wwww"><a href="#fnr-wwww">27</a></sup> G. K. Chesterton, [What's Wrong with the World](https://www.gutenberg.org/cache/epub/1717/pg1717-images.html#link2H_4_0005) (1910).

      <sup id="fn-conversion"><a href="#fnr-conversion">28</a></sup> G. K. Chesterton, [The Catholic Church and Conversion](https://www.gutenberg.org/cache/epub/76305/pg76305-images.html#Page_93) (1926).

      <sup id="fn-sayers"><a href="#fnr-sayers">29</a></sup> Dorothy L. Sayers, [The Lost Tools of Learning](https://www.gbt.org/text/sayers.html), a lecture given at Oxford in 1947.

      </div>

      <h3 id="tradeoffs">Nobody knows tradeoffs like a programmer</h3>

      I'd love a world of KISS and perfect, beautiful software. I wrote a whole
      essay about it, *For the love of the game*.

      But nobody should know tradeoffs better than a programmer. Every system we've
      ever built is a pile of them.

      We trade robustness for cost. Three regions and a hot standby, or one box and
      a backup you hope works.

      We trade beautiful code for speed.

      We trade personality for convention. We follow the style guide so the next
      person can read the code, and the code stops sounding like anybody.

      We trade features for security, and security for features. Lock it down and
      something breaks. Open it up and somebody walks in.

      We trade owning for renting. Every managed service is understanding we pay
      somebody else to hold.

      None of these are sins. The sin is pretending you aren't making a tradeoff.

      I wrote that we trade understanding for speed, like that settled it. AI is the
      biggest tradeoff on the table, and I've been treating it like a sin.

      So what does that do to everything I wrote? Was I wrong about everything?

      No.

      <h3 id="right">What I got right</h3>

      The ideal human-computer interface is still precise code, written, understood
      and audited by humans. Dijkstra predicted that a natural language interface
      would leave us bootstrapping our way back to a formal
      system.<sup id="fnr-ewd2"><a href="#fn-ewd2">30</a></sup> Look at what a coding agent does. English goes in,
      and code in a real programming language comes out.

      Nobody threw the programming languages away. The machine writes in them,
      because nothing else can command a computer precisely. So the code is still
      the interface, whether a human reads it or not.

      Borrow now, pay later still holds. Every line nobody understands is a loan.

      Ownership of understanding is still the thing. If I don't grok it, I don't own
      it, no matter whose name is on the license. "All men by nature desire to
      know,"<sup id="fnr-meta"><a href="#fn-meta">31</a></sup> and rented understanding doesn't feed that desire.
      Aquinas argued that every man has his own intellect.<sup id="fnr-st76"><a href="#fn-st76">32</a></sup> Now a
      billion people rent one.

      The surrender of technical autonomy is still underway. We pay to code, and the
      labs renting us the tokens are spending like nobody ever has. OpenAI ran a
      \$20.9 billion operating loss last year.<sup id="fnr-openai"><a href="#fn-openai">33</a></sup> Anthropic put
      nearly \$9 billion into computing in the first half of this year alone, and
      its commitments could reach \$750 billion.<sup id="fnr-anthropic"><a href="#fn-anthropic">34</a></sup> Somebody is
      going to pay that bill.

      Renting isn't a sin, I said so. A race for a monopoly to rent from is.

      And in *The problem of the human-computer interface* I wrote that this was
      surely a technology "unwise to send in to space, or to connect to the nuclear
      red button!" Since then, Anthropic reported that a weapons cell in Yemen used
      Claude Code in place of human engineers to write the guidance software for a
      guided rocket.<sup id="fnr-yemen"><a href="#fn-yemen">35</a></sup> The test firing appears to have failed, and
      within hours they were back asking Claude why.

      I'd rather have been wrong about that one.


title: It is not all about speed
slug: 2026-05-23-its-not-all-about-speed
date: 2026-05-23
author: Adam Schaefers
body: |

      ### I keep having to remind myself it's not about speed.

      Yes, there's an easy button now, "AI."
      But what good is it if AI owns my project, and not me?


      If it takes me longer, but I grok it, then that is extremely important.

      > "You will own nothing and be happy--"

      who knew at the time, but it seems AI has become a part of that idea.

      ### Own your code

      The issue isn't just licensing. And the issue isn't all about speed.

      **It's about ownership of understanding.**

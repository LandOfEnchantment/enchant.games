title: Using Large Language Models like Linus
slug: 2026-11-05-using-large-language-models-like-linus
date: 2026-11-05
author: Adam Schaefers
body: |

      *Republished from my blog at [adamschaefers.com](https://adamschaefers.com/blog/2026-11-05-using-large-language-models-like-linus/), where it first appeared on November 5, 2026.*

      In March I told you not to lean on AI to code. I changed my mind, [I was wrong](/journal/2026-11-05-i-was-wrong-about-ai/).

      ### Sign it, own it

      Linus Torvalds uses it. His patch series to make the page cache scale was, by [his own write-up](https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=4c0f3697118eb3a708ea79175f7f07c43339bfab), "done with an LLM coding assistant (Claude Code) under my direction." Each patch carries an "Assisted-by: LLM" line, right next to his "Signed-off-by."

      When Linus signs his patch, he owns it. When a company ships slop, it can't blame the model.

      ### The whiteboard

      [Mitchell Hashimoto](https://x.com/mitchellh/status/2100249348345057389) sets a lower bar, but he points out a level of understanding you have to keep through all of this AI madness. If you don't know the code line by line, you still need to be able to defend the design at a whiteboard, knowing how much understanding you traded for the speed of AI-generated code. Be able to talk about every architectural decision and the tradeoff behind it, the paradigms, the programming language, the libraries selected, the data model and its invariants, the concurrency model, the failure modes and the robustness built against them, the security considerations and trust boundaries, the optimizations and what each one costs, the test strategy, and how it's deployed, monitored and rolled back.

      ### Pragma

      This is the pragmatic approach I plan to follow to keep myself mentally fit for the job, however the job may evolve in the future.
